[package]
name = "mgit"
version = "0.1.0"
edition = "2021"
description = "A lightweight Git automation tool that generates commit messages from diffs."
license = "MIT"

[dependencies]
regex = "1"
dirs = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
reqwest = { version = "0.12", features = ["json", "blocking", "native-tls"] }
serde_json = "1"
